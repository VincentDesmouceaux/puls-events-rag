name: CI - Tests, Docker and Production Bot

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t puls-events-rag:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            puls-events-rag:ci \
            -c "import app.main; print('Docker smoke test OK')"

  production_bot:
    name: Production bot request
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for Northflank deployment
        run: |
          EXPECTED_VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)

          echo "Expected version: $EXPECTED_VERSION"

          for attempt in {1..20}; do
            RESPONSE=$(curl -s \
              "https://p01--p9bot--wd4gpkqcrlm8.code.run/health" \
              || true)

            echo "Attempt $attempt: $RESPONSE"

            if echo "$RESPONSE" | grep -q "\"version\":\"$EXPECTED_VERSION\""; then
              echo "Northflank deployment is ready."
              exit 0
            fi

            sleep 15
          done

          echo "Northflank did not deploy the expected version in time."
          exit 1

      - name: Ask production RAG bot
        run: |
          echo "Question envoyée au bot:"
          echo "Je cherche un événement jazz à Paris."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "https://p01--p9bot--wd4gpkqcrlm8.code.run/ask" \
            -H "Content-Type: application/json" \
            -d '{"question":"Je cherche un événement jazz à Paris."}')

          echo ""
          echo "Réponse du bot Northflank:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"answer"' || {
            echo "La réponse du bot ne contient pas le champ answer."
            exit 1
          }