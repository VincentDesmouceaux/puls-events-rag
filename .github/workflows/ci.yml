name: CI - Tests, Docker and Production Bot

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t puls-events-rag:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            puls-events-rag:ci \
            -c "import app.main; print('Docker smoke test OK')"

  rebuild_production_index:
    name: Rebuild production FAISS index
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check rebuild secret
        env:
          REBUILD_API_KEY: ${{ secrets.REBUILD_API_KEY }}
        run: |
          if [ -z "$REBUILD_API_KEY" ]; then
            echo "REBUILD_API_KEY is not configured in GitHub Actions."
            exit 1
          fi

          echo "REBUILD_API_KEY is configured."

      - name: Wait for Northflank deployment
        run: |
          EXPECTED_VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)

          echo "Expected API version: $EXPECTED_VERSION"

          for attempt in {1..20}; do
            RESPONSE=$(curl \
              --silent \
              --show-error \
              "https://p01--p9bot--wd4gpkqcrlm8.code.run/health" \
              || true)

            echo "Attempt $attempt: $RESPONSE"

            VERSION=$(echo "$RESPONSE" | python -c '
          import json
          import sys

          try:
              data = json.load(sys.stdin)
              print(data.get("version", ""))
          except Exception:
              print("")
          ')

            if [ "$VERSION" = "$EXPECTED_VERSION" ]; then
              echo "Northflank deployment is ready."
              exit 0
            fi

            sleep 15
          done

          echo "Northflank did not deploy the expected version in time."
          exit 1

      - name: Start background FAISS rebuild
        env:
          REBUILD_API_KEY: ${{ secrets.REBUILD_API_KEY }}
        run: |
          echo "Starting background FAISS rebuild..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/rebuild-response.json \
            --write-out "%{http_code}" \
            -X POST \
            "https://p01--p9bot--wd4gpkqcrlm8.code.run/rebuild" \
            -H "X-Rebuild-Key: $REBUILD_API_KEY")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/rebuild-response.json
          echo ""

          if [ "$HTTP_CODE" != "202" ]; then
            echo "The API did not accept the background rebuild."
            exit 1
          fi

          STATUS=$(python -c '
          import json

          with open("/tmp/rebuild-response.json") as file:
              data = json.load(file)

          print(data.get("status", ""))
          ')

          if [ "$STATUS" != "accepted" ]; then
            echo "Unexpected rebuild response."
            exit 1
          fi

          echo "Background rebuild accepted by FastAPI."

      - name: Wait for FAISS rebuild completion
        run: |
          echo "Monitoring /rebuild/status..."

          for attempt in {1..40}; do
            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              "https://p01--p9bot--wd4gpkqcrlm8.code.run/rebuild/status")

            echo "Attempt $attempt: $RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)
          print(data.get("status", "unknown"))
          ')

            if [ "$STATUS" = "completed" ]; then
              echo "FAISS rebuild completed successfully."

              {
                echo "# 🔄 Puls-Events RAG — FAISS Rebuild"
                echo ""
                echo "✅ Background FAISS rebuild completed successfully."
                echo ""
                echo "### Final status"
                echo ""
                echo '```json'
                echo "$RESPONSE"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "FAISS rebuild failed."
              echo "$RESPONSE"
              exit 1
            fi

            if [ "$STATUS" != "running" ]; then
              echo "Unexpected rebuild status: $STATUS"
              exit 1
            fi

            sleep 15
          done

          echo "FAISS rebuild timed out."
          exit 1

  production_bot:
    name: Production bot request
    runs-on: ubuntu-latest
    needs: rebuild_production_index

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ask production RAG bot
        id: rag_demo
        run: |
          QUESTION="Je cherche un événement jazz à Paris."

          echo "Question envoyée au bot:"
          echo "$QUESTION"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "https://p01--p9bot--wd4gpkqcrlm8.code.run/ask" \
            -H "Content-Type: application/json" \
            -d "{\"question\":\"$QUESTION\"}")

          echo ""
          echo "Réponse du bot Northflank:"
          echo "$RESPONSE"

          ANSWER=$(echo "$RESPONSE" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)

          if "answer" not in data:
              raise SystemExit(
                  "La réponse du bot ne contient pas le champ answer."
              )

          print(data["answer"])
          ')

          echo "question=$QUESTION" >> "$GITHUB_OUTPUT"

          {
            echo "answer<<EOF"
            echo "$ANSWER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build production demo summary
        run: |
          EXPECTED_VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)

          {
            echo "# 🤖 Puls-Events RAG — Production Demo"
            echo ""
            echo "## Question"
            echo ""
            echo "${{ steps.rag_demo.outputs.question }}"
            echo ""
            echo "## Réponse du bot"
            echo ""
            echo "${{ steps.rag_demo.outputs.answer }}"
            echo ""
            echo "---"
            echo ""
            echo "### Validation"
            echo ""
            echo "- ✅ Pytest"
            echo "- ✅ Docker build"
            echo "- ✅ Docker smoke test"
            echo "- ✅ Northflank deployment"
            echo "- ✅ Background FAISS rebuild"
            echo "- ✅ Production RAG request"
            echo "- ✅ API version: \`$EXPECTED_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"