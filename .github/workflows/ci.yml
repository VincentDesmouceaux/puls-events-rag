name: CI - Tests and Docker

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t puls-events-rag:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            puls-events-rag:ci \
            -c "import app.main; print('Docker smoke test OK')"