requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "mistralai>=2.9.4",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
    "zvec>=0.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
